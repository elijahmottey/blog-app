plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.3'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.graalvm.buildtools.native' version '0.11.3'
}

group = 'liv.codveda'
version = '0.0.1-SNAPSHOT'
description = 'blogging website'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

ext {
	springAiVersion = "1.1.2"
}

repositories {
	mavenCentral()
	maven { url 'https://repo.spring.io/milestone' }
}

dependencies {
	// Core
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-cache'

	// JPA
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'org.postgresql:postgresql'

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

	// Cache
	implementation 'com.github.ben-manes.caffeine:caffeine:3.2.2'

	// Spring AI (remove if not needed for native)
	// implementation 'org.springframework.ai:spring-ai-starter-model-openai'

	// OpenAPI
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.4'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// REMOVE this line - AOT is already included in Spring Boot 3.x
	// implementation 'org.springframework.boot:spring-boot-starter-aot'

	// Instead, add development dependencies for AOT processing
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	// Tests
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:$springAiVersion"
	}
}

graalvmNative {
	binaries {
		main {
			imageName = 'blog-app'
			// Add GraalVM Native Image arguments
			buildArgs.addAll([
					'--enable-url-protocols=http,https',
					'--enable-all-security-services',
					'--initialize-at-build-time=org.springframework.boot.SpringApplication,org.springframework.boot.autoconfigure.AutoConfigurationPackages',
					'-H:+ReportExceptionStackTraces',
					'-H:+ReportUnsupportedElementsAtRuntime',
					'-H:+AddAllCharsets',
					'-H:EnableURLProtocols=http,https',
					'-H:NativeLinkerOption=-no-pie',
					'--no-fallback',
					'--verbose'
			])
		}
	}
	metadataRepository {
		enabled = true
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

// Add this to help with native compilation
tasks.named('compileJava') {
	dependsOn('processAot')
}

tasks.named('processAot') {
	mustRunAfter('compileJava')
}