<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blogGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#92400e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#374151;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b7280;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="200" fill="url(#blogGradient)" rx="8" ry="8"/>

  <!-- Decorative elements -->
  <circle cx="60" cy="60" r="25" fill="rgba(255,255,255,0.2)"/>
  <circle cx="340" cy="140" r="20" fill="rgba(255,255,255,0.15)"/>
  <circle cx="320" cy="40" r="15" fill="rgba(255,255,255,0.1)"/>

  <!-- Writing lines -->
  <rect x="120" y="50" width="180" height="4" fill="rgba(255,255,255,0.8)" rx="2"/>
  <rect x="120" y="70" width="220" height="4" fill="rgba(255,255,255,0.8)" rx="2"/>
  <rect x="120" y="90" width="160" height="4" fill="rgba(255,255,255,0.8)" rx="2"/>
  <rect x="120" y="110" width="200" height="4" fill="rgba(255,255,255,0.8)" rx="2"/>
  <rect x="120" y="130" width="140" height="4" fill="rgba(255,255,255,0.8)" rx="2"/>

  <!-- Blog icon -->
  <g transform="translate(40, 120)">
    <!-- Notebook -->
    <rect x="0" y="0" width="40" height="50" fill="rgba(255,255,255,0.9)" rx="3"/>
    <!-- Lines in notebook -->
    <line x1="5" y1="10" x2="35" y2="10" stroke="url(#textGradient)" stroke-width="1"/>
    <line x1="5" y1="20" x2="35" y2="20" stroke="url(#textGradient)" stroke-width="1"/>
    <line x1="5" y1="30" x2="35" y2="30" stroke="url(#textGradient)" stroke-width="1"/>
    <line x1="5" y1="40" x2="35" y2="40" stroke="url(#textGradient)" stroke-width="1"/>
    <!-- Pen -->
    <rect x="45" y="-5" width="3" height="25" fill="#374151" transform="rotate(15)"/>
    <circle cx="46.5" cy="-8" r="2" fill="#dc2626"/>
  </g>

  <!-- Title text -->
  <text x="200" y="175" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="Arial, sans-serif" font-size="14" font-weight="bold">BLOG POST</text>
</svg>