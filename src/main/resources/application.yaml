spring:
  mvc:
    apiversion:
      supported:
        - "1.0"
        - "2.0"
      default: "1.0"
      use:
        path-segment: 1
  application:
    name: blog-app


  datasource:
    password: ${DB_PASSWORD1}
    url: ${DB_URL1}
    username: ${DB_USERNAME1}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect


server:
  port: 8088

jwt:
  secret: ${JWT}
  refresh-secret: ${REFRESH_TOKEN}

frontend:
  url: ${FRONTEND}
