spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  h2:
    console:
      enabled: false

jwt:
  secret: testSecretKeyThatIsLongEnoughForHS256AlgorithmTesting
  refresh-secret: testRefreshSecretKeyThatIsLongEnoughForHS256Testing

cookie:
  domain: localhost
  secure: false

frontend:
  url: http://localhost:5173

app:
  admin:
    name: Test Admin
    email: admin@test.com
    password: Password123!

logging:
  level:
    org.springframework.security: INFO
    org.hibernate: ERROR
