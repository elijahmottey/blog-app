spring:
  ai:
    openai:
      api-key: ${OPENROUTER_API_KEY}
#      base-url: https://api.openai.com/v1
#      chat:
#        options:
#          model: gpt-4o-mini
#          temperature: 0.7
#          max-tokens: 500


  application:
    name: blog-app


  datasource:
    password: ${DB_PASSWORD1}
    url: ${DB_URL1}
    username: ${DB_USERNAME1}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

    properties:
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
          format_sql: true
          jdbc:
            lob.non_contextual_creation: true
      database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8088

jwt:
  secret: ${JWT}
  refresh-secret: ${REFRESH_TOKEN}

frontend:
  url: ${FRONTEND}


logging:
  level:
    org.springframework.web.client.RestClient: DEBUG
    org.springframework.web.client.DefaultRestClient: DEBUG
    org.springframework.ai.openai.api: DEBUG


