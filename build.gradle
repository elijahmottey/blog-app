plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.graalvm.buildtools.native' version '0.11.3'
}

group = 'liv.codveda'
version = '0.0.1-SNAPSHOT'
description = 'blogging website'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
	maven { url 'https://repo.spring.io/milestone' }  // Required for Spring AI milestones
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-cache'

	// Core Spring AI starter (use milestone version for latest features)
	implementation 'org.springframework.ai:spring-ai-spring-boot-starter:1.0.0-M1'

	// OpenAI-specific integration for chat models
	implementation 'org.springframework.ai:spring-ai-openai-spring-boot-starter:1.0.0-M1'

	implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

	implementation 'com.github.ben-manes.caffeine:caffeine:3.2.2'
	runtimeOnly 'org.postgresql:postgresql'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.4'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Enable preview features for Java 25 (correct syntax for all compile tasks including tests)
tasks.withType(JavaCompile) {
	options.compilerArgs += ['--enable-preview']
}

// Enable preview for execution tasks (bootRun, tests, etc.)
tasks.withType(JavaExec) {
	jvmArgs += ['--enable-preview']
}