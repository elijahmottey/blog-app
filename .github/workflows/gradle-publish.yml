name: Java Native CI with Docker

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Docker login
      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build Native Docker Image
      - name: Build Native Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/blog-app:native .

      # Push Image
      - name: Push Native Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/blog-app:native
