spring:
  ai:
    openai:
      api-key: ${API_KEY}
      chat:
        model: gpt-4o-mini  # Or gpt-3.5-turbo for a cost-effective option
        options:
          temperature: 0.7  # Controls response creativity (0.0 = deterministic, 1.0 = very creative)
          max-tokens: 500   # Maximum tokens in the response (adjust based on needs)

  application:
    name: blog-app


  datasource:
    password: ${DB_PASSWORD1}
    url: ${DB_URL1}
    username: ${DB_USERNAME1}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

    properties:
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
          format_sql: true
          jdbc:
            lob.non_contextual_creation: true
      database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8088

jwt:
  secret: ${JWT}
  refresh-secret: ${REFRESH_TOKEN}

frontend:
  url: ${FRONTEND}
