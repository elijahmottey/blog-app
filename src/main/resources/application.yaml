spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${REDIRECT_URL}/google
            scope:
              - openid
              - profile
              - email
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            redirect-uri: ${REDIRECT_URL}/github
            scope:
              - read:user
              - user:email
        provider:
          google:
            issuer-uri: https://accounts.google.com
          github:
            issuer-uri: https://api.github.com

  ai:
    openai:
      api-key: ${OPENROUTER_API_KEY}



  application:
    name: blog-app


  datasource:
    password: ${DB_PASSWORD}
    url: ${DB_URL}
    username: ${DB_USERNAME}
    driver-class-name: org.postgresql.Driver

  cache:
    type: caffeine          # Enable Caffeine as the cache provider
    cache-names: # Define cache names used by @Cacheable/@CacheEvict across services
      - posts
      - postById
      - postByTitle
      - users
      - userById
      - userByEmail
      - userBlogHistory
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

    properties:
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
          format_sql: true
          jdbc:
            lob.non_contextual_creation: true
      database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8088

jwt:
  secret: ${JWT}
  refresh-secret: ${REFRESH_TOKEN}

frontend:
  url: ${FRONTEND}
app:
  admin:
    name: ${ADMIN_NAME}
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}


logging:
  level:
    org.springframework.web.client.RestClient: DEBUG
    org.springframework.web.client.DefaultRestClient: DEBUG
    org.springframework.ai.openai.api: DEBUG
    org.springframework.security: TRACE


